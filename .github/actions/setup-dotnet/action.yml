name: Setup .NET
description: Installs the SDK pinned by global.json, quiets the CLI and optionally restores a solution or project.

inputs:
  restore:
    description: Solution or project to restore. Empty skips the restore.
    default: ''

runs:
  using: composite
  steps:
    - name: Install SDK
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Configure CLI
      shell: pwsh
      run: |
        'DOTNET_NOLOGO=1', 'DOTNET_CLI_TELEMETRY_OPTOUT=1', 'MSBUILDDISABLENODEREUSE=1' |
          Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Restore
      if: inputs.restore != ''
      shell: pwsh
      env:
        RESTORE_TARGET: ${{ inputs.restore }}
      run: dotnet restore $env:RESTORE_TARGET
