# Dependabot version updates (security updates are enabled in the repository settings and ignore every limit below).
# Options: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# - No commit-message prefix: the repository convention is an imperative title with no prefix ("deps: ..." is not).
# - Every ecosystem waits at least 7 days after a release (zizmor dependabot-cooldown; a cooldown never delays a
#   security update).
# - Dependabot does not regenerate the SDK-implicit entries of packages.lock.json: check out its branch, run
#   `dotnet restore <project> --force-evaluate` for each project and push the result.
# - A dependency joins the first group it matches, so the specific groups come before the catch-all.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: [ dependencies, .NET ]
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      security-updates:
        applies-to: security-updates
        patterns: [ '*' ]
      test-infrastructure:
        patterns:
          - 'xunit.v3*'
          - 'Microsoft.Testing.*'
          - 'Microsoft.CodeAnalysis.*.Testing'
          - 'BenchmarkDotNet'
          - 'YamlDotNet'
        update-types: [ minor, patch ]
      analyzers:
        patterns:
          - 'Meziantou.Analyzer'
          - 'Microsoft.CodeAnalysis.BannedApiAnalyzers'
          - 'Microsoft.CodeAnalysis.PublicApiAnalyzers'
        update-types: [ minor, patch ]
      minor-and-patch:
        patterns: [ '*' ]
        update-types: [ minor, patch ]
    ignore:
      # The Roslyn pin moves together with RoslynComponentFloor (build error CESDK9002) and the SDK-bundled compiler:
      # a component built against a newer Roslyn does not load in an older consumer compiler (CS9057).
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.CSharp.Workspaces
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
      # SDK-implicit packages recorded in the lock files move only with global.json.
      - dependency-name: Microsoft.NET.ILLink.Tasks
      - dependency-name: Microsoft.DotNet.ILCompiler
      - dependency-name: 'runtime.*.Microsoft.DotNet.ILCompiler'

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: monthly
    labels: [ dependencies, .NET ]
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # A new .NET major is a deliberate migration (TargetFramework, AnalysisLevel pin, lock files), not a bump.
      - dependency-name: '*'
        update-types: [ 'version-update:semver-major' ]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    labels: [ dependencies, ci ]
    cooldown:
      # GitHub Actions supports default-days only (no SemVer-bump days).
      default-days: 7
    groups:
      actions:
        update-types: [ minor, patch ]
