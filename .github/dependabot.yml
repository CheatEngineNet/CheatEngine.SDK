version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [ minor, patch ]
    ignore:
      # The Roslyn pin moves together with RoslynComponentFloor (build error CESDK9002).
      - dependency-name: Microsoft.CodeAnalysis.CSharp
      - dependency-name: Microsoft.CodeAnalysis.CSharp.Workspaces

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [ minor, patch ]
