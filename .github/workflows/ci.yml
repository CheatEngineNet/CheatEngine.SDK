name: CI

on:
  workflow_call:
    inputs:
      collect-coverage:
        description: Emit Visual Studio XML coverage from Debug test jobs and upload it as coverage-<project>.
        type: boolean
        default: false
      upload-package:
        description: Upload the packed package as the nuget-package artifact.
        type: boolean
        default: false
      test-release:
        description: Also run every test project against the Release build, which is what ships.
        type: boolean
        default: false
      dependency-review:
        description: Run dependency-review-action for non-draft pull requests. Enable only after GitHub Dependency graph is enabled for the repository.
        type: boolean
        default: false
permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  discover:
    name: Discover tests
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tests
          persist-credentials: false

      - name: Find test projects
        id: projects
        env:
          TEST_RELEASE: ${{ inputs.test-release }}
        # Mirrors eng/Tests.props: a test project is any tests/**/*.Tests project, so a new one needs no edit here.
        run: |
          $projects = @(Get-ChildItem -Path tests -Filter '*.Tests.csproj' -Recurse -File | Sort-Object Name)
          if ($projects.Count -eq 0) { throw 'No *.Tests.csproj project found under tests.' }
          $configurations = if ($env:TEST_RELEASE -eq 'true') { 'Debug', 'Release' } else { 'Debug' }
          $include = foreach ($project in $projects) {
            foreach ($configuration in $configurations) {
              $suffix = if ($configuration -eq 'Release') { '-release' } else { '' }
              [ordered]@{
                name = $project.BaseName
                project = [IO.Path]::GetRelativePath($PWD.Path, $project.FullName).Replace('\', '/')
                configuration = $configuration
                label = "$($project.BaseName)$(if ($suffix) { ' (Release)' })"
                artifact = "$($project.BaseName)$suffix"
              }
            }
          }
          $matrix = ConvertTo-Json -Compress -InputObject ([ordered]@{ include = @($include) })
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Found $($projects.Count) test projects."
          $projects | ForEach-Object { Write-Host "  $($_.BaseName)" }

  native:
    name: Build native bridge
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1
        with:
          xmake-version: '3.0.9'

      - name: Build bridge
        run: |
          $ErrorActionPreference = 'Stop'
          # xmake 3.0.9 mis-parses an absolute Windows -o path when the target
          # uses $(builddir); keep both xmake paths relative and resolve them
          # only for PowerShell validation and cleanup.
          $repositoryRoot = [IO.Path]::GetFullPath($PWD.Path)
          $primaryOutput = 'artifacts/native/cheatengine-sdk-lua-bridge'
          $reproducibilityOutput = 'artifacts/native/cheatengine-sdk-lua-bridge-repro'
          $primaryOutputPath = [IO.Path]::GetFullPath((Join-Path $repositoryRoot $primaryOutput))
          $reproducibilityOutputPath = [IO.Path]::GetFullPath((Join-Path $repositoryRoot $reproducibilityOutput))
          if ([string]::Equals($primaryOutputPath, $reproducibilityOutputPath, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'The primary and reproducibility bridge output directories must be distinct.'
          }

          $workspacePrefix = "$repositoryRoot$([IO.Path]::DirectorySeparatorChar)"
          foreach ($resolvedOutput in @($primaryOutputPath, $reproducibilityOutputPath)) {
            if (-not $resolvedOutput.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
              throw "Refusing to clean native bridge output outside the checkout: '$resolvedOutput'."
            }
            if (Test-Path -LiteralPath $resolvedOutput) {
              Remove-Item -LiteralPath $resolvedOutput -Recurse -Force
            }
            New-Item -ItemType Directory -Path $resolvedOutput -Force | Out-Null
          }

          xmake f -P native/cheatengine-sdk-lua-bridge -o $primaryOutput -p windows -a x64 -m release -y
          if ($LASTEXITCODE -ne 0) {
            throw "xmake configuration for the primary bridge output failed with exit code $LASTEXITCODE."
          }
          xmake -P native/cheatengine-sdk-lua-bridge -y
          if ($LASTEXITCODE -ne 0) {
            throw "xmake build for the primary bridge output failed with exit code $LASTEXITCODE."
          }
          $primaryBridge = Join-Path $primaryOutputPath 'cheatengine-sdk-lua-bridge.dll'
          if (-not (Test-Path -LiteralPath $primaryBridge -PathType Leaf)) {
            throw "xmake did not produce '$primaryBridge'."
          }

          xmake f -P native/cheatengine-sdk-lua-bridge -o $reproducibilityOutput -p windows -a x64 -m release -y
          if ($LASTEXITCODE -ne 0) {
            throw "xmake configuration for the reproducibility bridge output failed with exit code $LASTEXITCODE."
          }
          xmake -P native/cheatengine-sdk-lua-bridge -y
          if ($LASTEXITCODE -ne 0) {
            throw "xmake build for the reproducibility bridge output failed with exit code $LASTEXITCODE."
          }
          $reproducibilityBridge = Join-Path $reproducibilityOutputPath 'cheatengine-sdk-lua-bridge.dll'
          if (-not (Test-Path -LiteralPath $reproducibilityBridge -PathType Leaf)) {
            throw "xmake did not produce '$reproducibilityBridge'."
          }

          $primaryHash = (Get-FileHash -LiteralPath $primaryBridge -Algorithm SHA256).Hash
          $reproducibilityHash = (Get-FileHash -LiteralPath $reproducibilityBridge -Algorithm SHA256).Hash
          if (-not [string]::Equals($primaryHash, $reproducibilityHash, [StringComparison]::OrdinalIgnoreCase)) {
            throw "The native bridge is not reproducible: '$primaryBridge' SHA-256 is $primaryHash but '$reproducibilityBridge' is $reproducibilityHash."
          }

      - name: Upload bridge
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lua-protection-bridge
          path: artifacts/native/cheatengine-sdk-lua-bridge/cheatengine-sdk-lua-bridge.dll
          if-no-files-found: error
          retention-days: 14

      # Run after upload so a failed drift check still leaves the corrected DLL available to download.
      - name: Verify checked-in bridge matches its source
        run: |
          $sourceHash = (Get-FileHash -Algorithm SHA256 native/cheatengine-sdk-lua-bridge/cheatengine_sdk_lua_bridge.c).Hash.ToLowerInvariant()
          $buildHash = (Get-FileHash -Algorithm SHA256 native/cheatengine-sdk-lua-bridge/xmake.lua).Hash.ToLowerInvariant()
          $expected = "$sourceHash`:$buildHash"
          $prebuilt = Resolve-Path native/cheatengine-sdk-lua-bridge/runtimes/win-x64/native/cheatengine-sdk-lua-bridge.dll
          $module = [System.Runtime.InteropServices.NativeLibrary]::Load($prebuilt.Path)
          try {
            $address = [System.Runtime.InteropServices.NativeLibrary]::GetExport($module, 'cheatengine_sdk_lua_bridge_source_fingerprint')
            $actual = [System.Runtime.InteropServices.Marshal]::PtrToStringAnsi($address)
          }
          finally {
            [System.Runtime.InteropServices.NativeLibrary]::Free($module)
          }
          if ($actual -ne $expected) {
            throw "The checked-in bridge is stale. Expected source fingerprint '$expected', found '$actual'. Download the lua-protection-bridge artifact from this run and commit it."
          }

      # This compiles the C++ transcription under MSVC x64 and validates its emitted facts. It proves the checked-in
      # header fixture and managed layout numbers agree; it does not contact or qualify a live Cheat Engine host.
      - name: Build and validate classic ABI fixture
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/native-abi-fixture/build.ps1 -OutputDirectory artifacts/native-abi-fixture
          if ($LASTEXITCODE -ne 0) {
            throw "Classic ABI fixture build failed with exit code $LASTEXITCODE."
          }

      # The fixture's fixed facts are first schema-validated in its build script. Build the managed ABI test app and
      # pass that same file to its direct comparer so C++ x64 measurements are checked against managed sizeof, offset,
      # and alignment measurements in one CI execution. The executable is used deliberately: native MTP currently
      # discovers this xUnit v3 app reliably through its generated host, while the SDK command only sees its module.
      - name: Setup .NET for classic ABI fact comparison
        uses: ./.github/actions/setup-dotnet
        with:
          restore: tests/CheatEngine.SDK.Abi.Tests/CheatEngine.SDK.Abi.Tests.csproj

      - name: Compare native fixture facts with managed ABI measurements
        env:
          CE77_NATIVE_ABI_FACTS_PATH: ${{ github.workspace }}/artifacts/native-abi-fixture/ce77-native-abi-facts.txt
          CE77_NATIVE_ABI_REQUIRED: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tests/CheatEngine.SDK.Abi.Tests/CheatEngine.SDK.Abi.Tests.csproj -c Debug --no-restore --disable-build-servers
          if ($LASTEXITCODE -ne 0) {
            throw "Managed ABI fact comparer build failed with exit code $LASTEXITCODE."
          }
          & ./artifacts/bin/CheatEngine.SDK.Abi.Tests/debug/CheatEngine.SDK.Abi.Tests.exe --fail-skips on
          if ($LASTEXITCODE -ne 0) {
            throw "Managed ABI fact comparer exited with code $LASTEXITCODE."
          }

      - name: Upload classic ABI fixture facts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: classic-abi-fixture-facts
          path: artifacts/native-abi-fixture/ce77-native-abi-facts.txt
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build
    needs: native
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          restore: CheatEngine.SDK.slnx

      - name: Use CI-built native bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lua-protection-bridge
          path: native/cheatengine-sdk-lua-bridge/runtimes/win-x64/native

      # Tests run against Debug, where some guards exist only. Release is what ships.
      - name: Build Debug
        run: |
          dotnet build CheatEngine.SDK.slnx --no-restore -c Debug
          if ($LASTEXITCODE -ne 0) {
            throw "Debug solution build failed with exit code $LASTEXITCODE."
          }

      # Do not rely only on the per-project matrix below: native MTP must also discover every test executable when
      # invoked through the solution. The preceding build is deliberately part of this job, so --no-build cannot
      # silently exercise stale or incomplete test-host output.
      - name: Test Debug solution discovery
        run: |
          dotnet test --solution CheatEngine.SDK.slnx --no-build --no-restore -c Debug --fail-skips on
          if ($LASTEXITCODE -ne 0) {
            throw "Debug solution test discovery failed with exit code $LASTEXITCODE."
          }

      - name: Build Release
        run: |
          dotnet build CheatEngine.SDK.slnx --no-restore -c Release
          if ($LASTEXITCODE -ne 0) {
            throw "Release solution build failed with exit code $LASTEXITCODE."
          }

  test:
    name: Test ${{ matrix.label }}
    needs: [ discover, native ]
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Use CI-built native bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lua-protection-bridge
          path: native/cheatengine-sdk-lua-bridge/runtimes/win-x64/native

      # A skipped test fails the Debug job: NativeLua tests skip when the bundled Lua DLL does not bind, and a green check must not hide that.
      # Release keeps one legitimate skip, a guard that only exists in Debug.
      - name: Test
        env:
          PROJECT: ${{ matrix.project }}
          CONFIGURATION: ${{ matrix.configuration }}
          RESULTS: artifacts/test-results/${{ matrix.artifact }}
          COLLECT_COVERAGE: ${{ inputs.collect-coverage }}
        run: |
          $options = '--project', $env:PROJECT, '-c', $env:CONFIGURATION, '--report-trx', '--results-directory', $env:RESULTS
          if ($env:CONFIGURATION -eq 'Debug') { $options += '--fail-skips', 'on' }
          if ($env:CONFIGURATION -eq 'Debug' -and $env:COLLECT_COVERAGE -eq 'true') { $options += '--coverage', '--coverage-output-format', 'xml', '--coverage-output', 'coverage.xml' }
          dotnet test @options
          if ($LASTEXITCODE -ne 0) {
            throw "Test project '$env:PROJECT' failed with exit code $LASTEXITCODE."
          }

      - name: Summarize results
        if: ${{ !cancelled() }}
        env:
          NAME: ${{ matrix.label }}
          RESULTS: artifacts/test-results/${{ matrix.artifact }}
        run: |
          $files = @(Get-ChildItem -Path $env:RESULTS -Filter *.trx -File -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { Write-Host '::warning::The test run produced no TRX report.'; return }
          $lines = foreach ($file in $files) {
            $results = @(([xml](Get-Content -LiteralPath $file.FullName -Raw)).TestRun.Results.UnitTestResult | Where-Object { $_ })
            $passed = @($results | Where-Object outcome -eq 'Passed').Count
            $skipped = @($results | Where-Object outcome -eq 'NotExecuted').Count
            $failed = @($results | Where-Object { $_.outcome -notin 'Passed', 'NotExecuted' })
            "### $env:NAME"
            ''
            '| Total | Passed | Failed | Skipped |'
            '| ---: | ---: | ---: | ---: |'
            "| $($results.Count) | $passed | $($failed.Count) | $skipped |"
            if ($failed.Count -gt 0) {
              ''
              $failed | Select-Object -First 20 | ForEach-Object { "- ``$($_.testName)``" }
              $rest = @($failed | Select-Object -Skip 20).Count
              if ($rest -gt 0) { "- and $rest more" }
            }
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.artifact }}
          path: artifacts/test-results/${{ matrix.artifact }}/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage
        if: ${{ inputs.collect-coverage && matrix.configuration == 'Debug' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.name }}
          path: artifacts/test-results/${{ matrix.artifact }}/coverage.xml
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack
    needs: native
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Use CI-built native bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lua-protection-bridge
          path: native/cheatengine-sdk-lua-bridge/runtimes/win-x64/native

      - name: Pack
        run: |
          dotnet pack src/CheatEngine.SDK -c Release -o artifacts/nuget
          if ($LASTEXITCODE -ne 0) {
            throw "SDK package creation failed with exit code $LASTEXITCODE."
          }

      - name: Verify package
        run: |
          $packages = @(Get-ChildItem -Path artifacts/nuget -Filter *.nupkg -File)
          if ($packages.Count -ne 1) { throw "Expected one package in artifacts/nuget, found $($packages.Count)." }
          Write-Host "Packed $($packages[0].Name)."

      - name: Upload package
        if: ${{ inputs.upload-package }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 90

  aot:
    name: Native AOT publication probe
    needs: native
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version from tags and history
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          restore: tests/CheatEngine.SDK.AotProbe/CheatEngine.SDK.AotProbe.csproj

      - name: Restore Native AOT library loader harness
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore tests/CheatEngine.SDK.NativeAotLibraryProbe/CheatEngine.SDK.NativeAotLibraryProbe.csproj
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT library probe restore failed with exit code $LASTEXITCODE."
          }
          dotnet restore tests/CheatEngine.SDK.NativeAotLoaderHarness/CheatEngine.SDK.NativeAotLoaderHarness.csproj
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT loader harness restore failed with exit code $LASTEXITCODE."
          }

      - name: Use CI-built native bridge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lua-protection-bridge
          path: native/cheatengine-sdk-lua-bridge/runtimes/win-x64/native

      # This executable is an AOT/trim graph probe only. It is not a plugin candidate for Cheat Engine's hostfxr path.
      - name: Publish and run Native AOT probe
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $PWD 'artifacts/aot-probe'
          dotnet publish tests/CheatEngine.SDK.AotProbe/CheatEngine.SDK.AotProbe.csproj -c Release --no-restore -o $output
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT probe publish failed with exit code $LASTEXITCODE."
          }
          $probe = Join-Path $output 'CheatEngine.SDK.AotProbe.exe'
          if (-not (Test-Path -LiteralPath $probe -PathType Leaf)) {
            throw "Native AOT publish did not produce '$probe'."
          }
          & $probe
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT probe exited with code $LASTEXITCODE."
          }

      # This remains a test-library observation. It never starts Cheat Engine, invokes an export, or unloads a NativeAOT DLL.
      - name: Publish and inspect Native AOT library probe
        run: |
          $ErrorActionPreference = 'Stop'
          $profileOutput = Join-Path $PWD 'artifacts/nativeaot-loader-profile'
          $libraryProject = 'tests/CheatEngine.SDK.NativeAotLibraryProbe/CheatEngine.SDK.NativeAotLibraryProbe.csproj'
          $harnessProject = 'tests/CheatEngine.SDK.NativeAotLoaderHarness/CheatEngine.SDK.NativeAotLoaderHarness.csproj'
          dotnet publish $libraryProject -c Release --no-restore -o $profileOutput
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT shared-library publish failed with exit code $LASTEXITCODE."
          }
          dotnet publish $harnessProject -c Release --no-restore -o $profileOutput
          if ($LASTEXITCODE -ne 0) {
            throw "Native AOT loader harness publish failed with exit code $LASTEXITCODE."
          }
          $library = Join-Path $profileOutput 'CheatEngine.SDK.NativeAotLibraryProbe.dll'
          $harness = Join-Path $profileOutput 'CheatEngine.SDK.NativeAotLoaderHarness.exe'
          if (-not (Test-Path -LiteralPath $library -PathType Leaf)) {
            throw "Native AOT shared-library publish did not produce '$library'."
          }
          if (-not (Test-Path -LiteralPath $harness -PathType Leaf)) {
            throw "Native AOT loader harness publish did not produce '$harness'."
          }
          & $harness --analyze $library
          if ($LASTEXITCODE -ne 0) { throw "Native AOT loader harness analysis exited with code $LASTEXITCODE." }
          & $harness --load --acknowledge-process-resident-load
          if ($LASTEXITCODE -ne 0) { throw "Native AOT loader harness load exited with code $LASTEXITCODE." }

  sonar:
    name: Sonar
    needs: [ native, test ]
    if: ${{ inputs.collect-coverage }}
    uses: ./.github/workflows/sonar.yml
    with:
      wait-quality-gate: true

  dependency-review:
    name: Dependency review
    if: ${{ inputs.dependency-review && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
  lint-workflows:
    name: Lint workflows
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9
    steps:
      - name: Checkout workflow definitions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - name: Run actionlint
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'actionlint.zip'
          $url = "https://github.com/rhysd/actionlint/releases/download/v$env:ACTIONLINT_VERSION/actionlint_$($env:ACTIONLINT_VERSION)_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ACTIONLINT_SHA256) {
            throw "actionlint $env:ACTIONLINT_VERSION has SHA-256 $actual, expected $env:ACTIONLINT_SHA256."
          }
          $destination = Join-Path $env:RUNNER_TEMP 'actionlint'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          & (Join-Path $destination 'actionlint.exe') -color
          if ($LASTEXITCODE -ne 0) {
            throw "actionlint failed with exit code $LASTEXITCODE."
          }

  gate:
    name: Gate
    if: ${{ always() }}
    needs: [ discover, native, build, test, pack, aot, sonar, dependency-review, lint-workflows ]
    runs-on: windows-latest
    timeout-minutes: 5
    permissions: { }
    steps:
      - name: Check results
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACK_RESULT: ${{ needs.pack.result }}
          AOT_RESULT: ${{ needs.aot.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          SONAR_REQUIRED: ${{ inputs.collect-coverage }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          DEPENDENCY_REQUIRED: ${{ inputs.dependency-review && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
          LINT_RESULT: ${{ needs.lint-workflows.result }}
        run: |
          $results = [ordered]@{
            discover = $env:DISCOVER_RESULT
            native = $env:NATIVE_RESULT
            build = $env:BUILD_RESULT
            test = $env:TEST_RESULT
            pack = $env:PACK_RESULT
            aot = $env:AOT_RESULT
            sonar = $env:SONAR_RESULT
            'dependency-review' = $env:DEPENDENCY_RESULT
            'lint-workflows' = $env:LINT_RESULT
          }
          $rows = $results.GetEnumerator() | ForEach-Object { "| $($_.Key) | $($_.Value) |" }
          '| Job | Result |', '| --- | --- |', $rows | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $failed = @($results.GetEnumerator() | Where-Object {
            $_.Key -in 'discover', 'native', 'build', 'test', 'pack', 'aot' -and $_.Value -ne 'success' -or
            $_.Key -eq 'sonar' -and $env:SONAR_REQUIRED -eq 'true' -and $_.Value -ne 'success' -or
            $_.Key -eq 'dependency-review' -and $env:DEPENDENCY_REQUIRED -eq 'true' -and $_.Value -ne 'success' -or
            $_.Key -eq 'lint-workflows' -and $_.Value -ne 'success'
          } | ForEach-Object Key)
          if ($failed.Count -gt 0) {
            Write-Host "::error::Not successful: $($failed -join ', ')."
            exit 1
          }
