name: Main CI

# Every commit that lands on main, and manual runs on any branch. There is no merge queue, so there is no merge_group
# trigger: an event path that never runs must not live in the required check.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# No concurrency group: every main commit keeps its own complete run.

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      sonar: true # a push to main reports the quality gate; a manual run waits for it
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
