name: Main CI

on:
  push:
    branches: [ main ]
  merge_group:
    types: [ checks_requested ]
  workflow_dispatch:

# No concurrency group: every main commit and merge group keeps its own complete run.

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      sonar: true # ci.yml skips it for the merge queue and only reports the quality gate outside pull requests
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
