name: Pull request CI

# No path filter: the required check "CI / Gate" must report on every pull request.
on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

# A new push supersedes the previous run of the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  ci:
    name: CI
    # Drafts do not run CI. "Ready for review" starts it; until then the required CI / Gate check stays pending.
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/ci.yml
    with:
      sonar: true # the gate still expects no Sonar run for fork and Dependabot pull requests, which receive no secrets
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
