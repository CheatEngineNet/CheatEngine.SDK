# Advisory weekly health checks (audit register PR-CQ-55, PR-CQ-30, A21-25). Not part of CI / Gate: they watch what
# changes without a commit of this repository.
# - audit: every package, direct and transitive, at every severity (NU1900-NU1905 are errors only here).
# - canary: the newest .NET SDK of the pinned channel regenerates the lock files, builds, packs and tests; the lock-file
#   patch is the artifact a maintainer applies to the Dependabot dotnet-sdk pull request.
# - test-repeat: the threading-sensitive NativeLua modules, five runs in a row (flaky-test policy).
# - bridge-drift: the latest release tag's native bridge rebuilt with today's toolchain, compared with the released DLL.
# - links: external links of the Markdown files (never checked in a pull request gate).
# - notify: on scheduled runs only, opens or updates one issue when anything above needs attention.
# How to act on each job: eng/ci/health/README.md. GitHub disables a scheduled workflow after 60 days without
# repository activity, and a dispatch needs this file on the default branch.
name: Scheduled health

on:
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:

# One health run at a time; a second trigger waits instead of cancelling a run that is about to report.
concurrency:
  group: scheduled-health
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  audit:
    name: Strict NuGet audit
    # Windows: the lock files of the Native AOT projects hold win-x64 ILCompiler sections, so a locked restore needs it.
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The script restores every project itself (locked, forced, with the strict audit properties).
      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Audit every package at every severity
        run: |
          ./eng/ci/health/Invoke-VulnerabilityAudit.ps1 -OutputDirectory artifacts/health/audit
          if ($LASTEXITCODE -ne 0) {
            throw "The strict NuGet audit failed with exit code $LASTEXITCODE."
          }

  canary:
    name: Newest .NET SDK canary
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer versions the package, and the canary diffs the lock files against HEAD
          persist-credentials: false

      # Before the composite action, which installs exactly the SDK global.json names (rollForward: disable). Only
      # sdk.version changes, in this checkout only; the test runner section stays.
      - name: Select the newest SDK of the channel
        id: sdk
        run: |
          ./eng/ci/health/Set-CanarySdkVersion.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Selecting the canary SDK failed with exit code $LASTEXITCODE."
          }

      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Regenerate lock files, build, pack and test
        run: |
          ./eng/ci/health/Invoke-SdkCanary.ps1 -OutputDirectory artifacts/health/sdk-canary
          if ($LASTEXITCODE -ne 0) {
            throw "The SDK canary failed with exit code $LASTEXITCODE."
          }

      - name: Upload canary results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-sdk-canary
          path: |
            artifacts/health/sdk-canary/lock-files.patch
            artifacts/health/sdk-canary/summary.md
            artifacts/health/sdk-canary/test-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  test-repeat:
    name: Repeat threading-sensitive tests
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer computes the version of the libraries the test modules build
          persist-credentials: false

      # The script restores the three test projects itself, in locked mode.
      - name: Set up .NET
        uses: ./.github/actions/setup-dotnet

      - name: Run the NativeLua modules five times
        run: |
          ./eng/ci/health/Invoke-TestRepeat.ps1 -Iterations 5 -OutputDirectory artifacts/health/test-repeat
          if ($LASTEXITCODE -ne 0) {
            throw "The repeated test runs failed with exit code $LASTEXITCODE."
          }

      - name: Upload failed runs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-test-repeat
          path: artifacts/health/test-repeat
          if-no-files-found: ignore
          retention-days: 14

  bridge-drift:
    name: Release bridge rebuild
    runs-on: windows-2025
    timeout-minutes: 20
    # Keep in sync with the ci.yml native job: the same toolchain pins, so a drift means today's pinned CI toolchain no
    # longer rebuilds the released bytes. GovernanceWorkflowTests compares both jobs.
    env:
      BRIDGE_VS_TOOLSET: '14.44'
      BRIDGE_VS_SDKVER: '10.0.26100.0'
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags and origin/main select the tag to rebuild
          persist-credentials: false

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@3a1a5dddfc7fa625d9a698738334bf55655a861a # v1.2.5
        with:
          xmake-version: '3.0.9'

      - name: Rebuild the latest release bridge
        id: drift
        run: |
          $pins = @("--vs_toolset=$env:BRIDGE_VS_TOOLSET", "--vs_sdkver=$env:BRIDGE_VS_SDKVER")
          ./eng/ci/health/Invoke-BridgeDriftCheck.ps1 -OutputDirectory artifacts/health/bridge-drift -XmakeConfigArgument $pins
          if ($LASTEXITCODE -ne 0) {
            throw "The release bridge rebuild failed with exit code $LASTEXITCODE."
          }

      - name: Upload the drift report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: health-bridge-drift
          path: artifacts/health/bridge-drift
          if-no-files-found: warn
          retention-days: 30

  links:
    name: External documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      broken: ${{ steps.links.outputs.broken }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reports broken links through its output and the job summary; it never fails on a link.
      - name: Check external links
        id: links
        run: |
          ./eng/ci/health/Test-ExternalLink.ps1 -OutputDirectory artifacts/health/links
          if ($LASTEXITCODE -ne 0) {
            throw "The link check failed with exit code $LASTEXITCODE."
          }

  notify:
    name: Report health
    needs: [ audit, canary, test-repeat, bridge-drift, links ]
    # Scheduled runs only: a manual dispatch is watched by the person who started it.
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open or update the single scheduled health issue
    steps:
      - name: Checkout the health scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: eng/ci/health
          persist-credentials: false

      # Only job ids, job results, two booleans and the run URL reach the issue (closed vocabularies).
      - name: Open or update the health issue
        env:
          NEEDS: ${{ toJSON(needs) }}
          DRIFT: ${{ needs.bridge-drift.outputs.drift }}
          BROKEN_LINKS: ${{ needs.links.outputs.broken }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./eng/ci/health/Publish-HealthIssue.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Reporting the scheduled health failed with exit code $LASTEXITCODE."
          }
